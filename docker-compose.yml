services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ponto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-ponto}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Descomente para acessar o banco de fora (DBeaver, psql, testes locais)
    # ports:
    #   - "5432:5432"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: ${PORT:-8080}
      # No compose o host do banco é o nome do serviço ("db"), nunca localhost
      DATABASE_URL: postgresql://${POSTGRES_USER:-ponto}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ponto}?schema=public
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?defina CORS_ALLOWED_ORIGINS no .env}
      MODERATOR_NAME: ${MODERATOR_NAME:?defina MODERATOR_NAME no .env}
      MODERATOR_PASSWORD: ${MODERATOR_PASSWORD:?defina MODERATOR_PASSWORD no .env}
      TIME_CLOCK_NAME: ${TIME_CLOCK_NAME:?defina TIME_CLOCK_NAME no .env}
      TIME_CLOCK_PASSWORD: ${TIME_CLOCK_PASSWORD:?defina TIME_CLOCK_PASSWORD no .env}
      RUN_SEED: ${RUN_SEED:-true}

volumes:
  pgdata:
